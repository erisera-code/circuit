name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Generated namespaced.css is committed
        run: git diff --exit-code -- packages/circuit/src/namespaced.css

  workflow-lint:
    uses: johnhenry/workflows/.github/workflows/workflow-lint.yml@v1
